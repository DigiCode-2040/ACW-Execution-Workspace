<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACW · Execution Workspace</title><style>
:root{--accent:#4ee6ef;--bg:#071019;--surface:rgba(17,39,54,.78);--text:#d6e9f0;--muted:#829faf;--border:rgba(78,230,239,.29);--glass:78%;--glow:1;--radius:12px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0%,color-mix(in srgb,var(--accent) 9%,transparent),transparent 50%),var(--bg);color:var(--text);font:14px/1.5 system-ui,Segoe UI,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button,select{background:#102431;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 10px;cursor:pointer}button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}header{height:56px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#07111be8;position:sticky;top:0;z-index:10;gap:12px}header .left,header .right{display:flex;align-items:center;gap:10px}.brand{color:var(--accent);font-weight:800;letter-spacing:.12em;margin-right:12px}.clock{color:var(--muted);font-variant-numeric:tabular-nums}.menu-wrap{position:relative}.popup{position:absolute;top:43px;left:0;min-width:230px;background:#0e202e;border:1px solid var(--border);border-radius:12px;padding:15px;z-index:30;box-shadow:0 20px 55px #0009}.right .popup{left:auto;right:0;width:280px}.popup label{display:block;margin:10px 0}.popup input[type=checkbox]{accent-color:var(--accent);margin-right:9px}.popup input[type=range]{width:100%}.popup select{width:100%}main{padding:22px;max-width:1800px;margin:auto}.console{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 0 calc(var(--glow)*25px) color-mix(in srgb,var(--accent) 10%,transparent);overflow:hidden}.prompt{display:flex;align-items:flex-start;padding:14px 18px;gap:12px}.prompt strong{color:var(--accent);font:700 20px monospace}textarea{resize:none;overflow:hidden;min-height:29px;max-height:180px;flex:1;border:0;outline:none;background:transparent;color:var(--text);font:14px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace}.hint{color:var(--muted);font-size:12px}.history{border-top:1px solid var(--border);background:#07111b80;padding:10px 18px;font:12px/1.6 ui-monospace,Consolas,monospace;min-height:55px}.history .entry{display:flex;gap:12px;color:var(--muted)}.history time{color:var(--accent)}.workspace-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:25px 0 14px}.workspace-head h2{font-size:14px;letter-spacing:.13em;color:var(--accent);margin:0}.subtle{color:var(--muted);font-size:12px}.jobs{display:grid;gap:18px}.job{border:1px solid var(--border);border-radius:var(--radius);padding:15px;background:#0c1c2ac9}.job-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px;flex-wrap:wrap}.job-head b{font-size:15px}.job-head .meta{color:var(--muted);font:12px monospace}.pill{border:1px solid var(--border);border-radius:30px;padding:2px 10px;color:var(--accent);font-size:11px;text-transform:uppercase}.pill.failed{color:#ff838e}.pill.completed{color:#72e0b4}.panels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}.pane{min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:17px;min-height:178px;position:relative;box-shadow:0 12px 30px #0003;backdrop-filter:blur(9px)}.pane:not(:last-child):after{content:'→';position:absolute;right:-22px;top:45%;color:var(--accent);font-size:22px}.pane h3{margin:0 0 13px;color:var(--accent);font-size:12px;letter-spacing:.12em}.metric{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px solid #ffffff0c}.metric span:first-child{color:var(--muted)}.metric span:last-child{font-variant-numeric:tabular-nums;text-align:right;overflow-wrap:anywhere}.bar{height:5px;background:#233f50;border-radius:8px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:var(--accent);transition:width .35s}.logs{font:12px/1.7 ui-monospace,Consolas,monospace;color:#afc8d3;max-height:130px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}.empty{padding:50px 20px;text-align:center;border:1px dashed var(--border);border-radius:var(--radius);color:var(--muted)}.jobs.collapsed{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}.collapsed .panels{display:none}.jobs.flow .panels{grid-template-columns:1fr}.flow .pane:not(:last-child):after{content:'↓';right:50%;top:auto;bottom:-27px}.jobs.flow .panels{gap:28px}.jobs.layered .panels{display:flex;align-items:stretch;justify-content:center;perspective:1100px;min-height:220px;padding:18px 4px 25px}.layered .pane{flex:1;max-width:370px;transform:rotateY(-9deg) translateZ(0);margin-right:-28px;transition:transform .3s}.layered .pane:nth-child(2){transform:translateY(10px) translateZ(30px);z-index:2}.layered .pane:nth-child(3){transform:rotateY(9deg) translateY(20px);z-index:3}.layered .pane:hover{transform:translateY(-5px) translateZ(60px);z-index:4}.layered .pane:after{display:none}.danger{color:#ff9ca5}.foot{padding:30px 0;color:var(--muted);font-size:12px}body.compact main{padding:12px}body.compact .pane{padding:10px;min-height:135px}body.compact .job{padding:10px}@media(max-width:900px){.panels{grid-template-columns:1fr;gap:20px}.pane:not(:last-child):after{content:'↓';right:50%;top:auto;bottom:-23px}.jobs.layered .panels{display:grid;perspective:none}.layered .pane{margin:0;max-width:none;transform:none!important}header{padding:0 9px}.brand{margin-right:0}.clock{font-size:11px}main{padding:12px}}
</style></head><body><header><div class="left"><span class="brand">ACW / LOCAL</span><div class="menu-wrap"><button data-menu="monitors">☷ Monitors ▾</button><div id="monitors" class="popup" hidden><b>Visible metrics</b><div id="monitor-options"></div></div></div><div class="menu-wrap"><button data-menu="layouts">▦ Layout ▾</button><div id="layouts" class="popup" hidden><b>Organization</b><div id="layout-options"></div></div></div></div><div class="right"><span id="clock" class="clock"></span><div class="menu-wrap"><button data-menu="settings" aria-label="Preferences">⚙</button><div id="settings" class="popup" hidden><b>Preferences</b><label>Theme<select id="theme"><option value="cyan">Cyan Cyberpunk</option><option value="violet">Quantum Violet</option><option value="green">Matrix Green</option><option value="amber">Industrial Amber</option></select></label><label>History lines <span id="hist-val"></span><input id="history-count" type="range" min="1" max="20"></label><label>Glass opacity <span id="opacity-val"></span><input id="opacity" type="range" min="35" max="98"></label><label><input id="glow" type="checkbox">Edge glow</label><label><input id="compact" type="checkbox">Compact density</label></div></div></div></header><main><section class="console"><div class="prompt"><strong>&gt;</strong><textarea id="command" rows="1" spellcheck="false" placeholder="help · run demo · run quality · list · layout flow"></textarea><span class="hint">Enter ↵</span></div><div class="history" id="history"></div></section><div class="workspace-head"><div><h2>EXECUTION WORKSPACE</h2><div class="subtle" id="connection">Connecting to local Python bridge…</div></div><button id="run-demo">▶ Run demo</button></div><section class="jobs connected" id="jobs"><div class="empty">Start an approved task to populate the workspace.</div></section><div class="foot">Local-only desktop workspace · Jobs run through an allowlisted Python engine · No HTTP listener</div></main><script>
'use strict';
const defaults={theme:'cyan',layout:'connected',historyCount:5,opacity:78,glow:true,compact:false,monitors:['cpu','systemmem','taskmem','started','ended','runtime','events','quality','output']};
let prefs={...defaults}, jobs=[], history=[], bridgeReady=false, busy=false;
try{prefs={...defaults,...JSON.parse(localStorage.getItem('acw.preferences')||'{}')}}catch{}
const $=id=>document.getElementById(id);
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const monLabels={cpu:'CPU utilization',systemmem:'System memory*',taskmem:'Task memory',started:'Started',ended:'Ended',runtime:'Runtime',events:'Events',quality:'Quality',output:'Output'};
const palettes={cyan:['#4ee6ef','#071019','#112736'],violet:['#bca3ff','#100d1c','#29203b'],green:['#78e4ac','#091712','#16362b'],amber:['#ffc36c','#1a130b','#3a2b1b']};
function save(){try{localStorage.setItem('acw.preferences',JSON.stringify(prefs))}catch{}}
function apply(){const [accent,bg,surface]=palettes[prefs.theme]||palettes.cyan;const r=document.documentElement.style;r.setProperty('--accent',accent);r.setProperty('--bg',bg);r.setProperty('--surface',surface);r.setProperty('--glow',prefs.glow?'1':'0');r.setProperty('--glass',prefs.opacity+'%');r.setProperty('--surface',`color-mix(in srgb, ${surface} ${prefs.opacity}%, transparent)`);document.body.classList.toggle('compact',prefs.compact);$('jobs').className='jobs '+prefs.layout;$('theme').value=prefs.theme;$('history-count').value=prefs.historyCount;$('hist-val').textContent=prefs.historyCount;$('opacity').value=prefs.opacity;$('opacity-val').textContent=prefs.opacity+'%';$('glow').checked=prefs.glow;$('compact').checked=prefs.compact;renderHistory();renderJobs();save()}
function log(s){history.push({time:new Date().toLocaleTimeString(),text:s});history=history.slice(-200);renderHistory()}
function renderHistory(){$('history').innerHTML=history.slice(-prefs.historyCount).map(x=>`<div class="entry"><time>${escapeHTML(x.time)}</time><span>${escapeHTML(x.text)}</span></div>`).join('')||'<span class="subtle">Ready. Type help for commands.</span>'}
function metric(label,value){return `<div class="metric"><span>${escapeHTML(label)}</span><span>${escapeHTML(value)}</span></div>`}
function renderJobs(){let el=$('jobs');el.className='jobs '+prefs.layout;if(!jobs.length){el.innerHTML='<div class="empty">No executions yet. Type <b>run demo</b> or <b>run quality</b>.</div>';return}el.innerHTML=jobs.map(j=>{let m=prefs.monitors,show=(k,label,val)=>m.includes(k)?metric(label,val):'';let output=(j.output||[]).slice(-6).map(escapeHTML).join('\n');let events=(j.events||[]).slice(-6).map(e=>escapeHTML(e.kind+': '+e.message)).join('\n');return `<article class="job"><div class="job-head"><div><b>${escapeHTML(j.label)}</b> <span class="meta">#${escapeHTML(j.id)}</span></div><div><span class="pill ${escapeHTML(j.status)}">${escapeHTML(j.status)}</span> ${j.status==='running'?`<button class="cancel" data-id="${escapeHTML(j.id)}">Stop</button>`:''}</div></div><div class="panels"><div class="pane"><h3>TASK / OVERVIEW</h3>${metric('Script',j.name)}${show('started','Started',j.started||'—')}${show('ended','Ended',j.ended||'—')}${show('runtime','Runtime',j.runtime+' s')}${show('cpu','CPU',j.cpu+' %')}${show('taskmem','Task memory',j.memory_mb+' MB')}${show('systemmem','System memory','Not collected')}</div><div class="pane"><h3>WORKING PARTS</h3>${metric('Stage',j.stage)}${metric('Progress',j.progress+'%')}<div class="bar"><i style="width:${Math.max(0,Math.min(100,Number(j.progress)||0))}%"></i></div>${m.includes('events')?`<div class="logs">${events||'Waiting for events…'}</div>`:''}</div><div class="pane"><h3>OUTPUT / RESULTS</h3>${show('quality','Quality',j.quality==null?'Not evaluated':j.quality+'%')}${metric('Exit code',j.exit_code??'—')}${m.includes('output')?`<div class="logs">${output||'Awaiting output…'}</div>`:''}${(j.artifacts||[]).length?metric('Artifacts',j.artifacts.join(', ')):''}</div></div></article>`}).join('');document.querySelectorAll('.cancel').forEach(b=>b.onclick=async()=>{try{await window.pywebview.api.cancel_job(b.dataset.id);log('Cancellation requested: '+b.dataset.id)}catch(e){log('Error: '+e)}})}
function setupMenus(){document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>{const id=b.dataset.menu;document.querySelectorAll('.popup').forEach(p=>p.hidden=p.id===id?!p.hidden:true)});document.addEventListener('click',e=>{if(!e.target.closest('.menu-wrap'))document.querySelectorAll('.popup').forEach(p=>p.hidden=true)});$('monitor-options').innerHTML=Object.entries(monLabels).map(([k,v])=>`<label><input type="checkbox" data-monitor="${k}" ${prefs.monitors.includes(k)?'checked':''}>${escapeHTML(v)}</label>`).join('');document.querySelectorAll('[data-monitor]').forEach(c=>c.onchange=()=>{prefs.monitors=Array.from(document.querySelectorAll('[data-monitor]:checked')).map(x=>x.dataset.monitor);apply()});$('layout-options').innerHTML=['connected','flow','layered','collapsed'].map(k=>`<label><input type="radio" name="layout" value="${k}" ${prefs.layout===k?'checked':''}>${k[0].toUpperCase()+k.slice(1)}</label>`).join('');document.querySelectorAll('[name=layout]').forEach(c=>c.onchange=()=>{prefs.layout=c.value;apply()});$('theme').onchange=e=>{prefs.theme=e.target.value;apply()};$('history-count').oninput=e=>{prefs.historyCount=Number(e.target.value);apply()};$('opacity').oninput=e=>{prefs.opacity=Number(e.target.value);apply()};$('glow').onchange=e=>{prefs.glow=e.target.checked;apply()};$('compact').onchange=e=>{prefs.compact=e.target.checked;apply()}}
async function command(line){line=line.trim();if(!line)return;log('> '+line);let [verb,...args]=line.split(/\s+/);try{if(verb==='help')log('Commands: help, catalog, run demo, run quality, list, layout connected|flow|layered|collapsed, stop <id>, clear');else if(verb==='catalog'){const cat=await window.pywebview.api.catalog();log(cat.map(x=>x.name+': '+x.description).join(' | '))}else if(verb==='run'){if(!args[0])throw Error('Specify an approved script: demo or quality');const r=await window.pywebview.api.start_job(args[0]);log('Job queued: '+r.id)}else if(verb==='stop'){await window.pywebview.api.cancel_job(args[0]);log('Cancellation requested')}else if(verb==='list'){log(jobs.map(j=>j.id+':'+j.status).join(' | ')||'No jobs')}else if(verb==='layout'){if(!['connected','flow','layered','collapsed'].includes(args[0]))throw Error('Unknown layout');prefs.layout=args[0];apply();log('Layout: '+args[0])}else if(verb==='clear'){history=[];renderHistory()}else log('Unknown command. Type help.')}catch(e){log('Error: '+(e.message||e))}}
$('command').addEventListener('input',e=>{e.target.style.height='29px';e.target.style.height=Math.min(e.target.scrollHeight,180)+'px'});$('command').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();const line=e.target.value;e.target.value='';e.target.style.height='29px';if(!bridgeReady){log('Python bridge not available. Launch with python main.py');return}command(line)}});$('run-demo').onclick=()=>bridgeReady?command('run demo'):log('Launch with python main.py');
function refreshClock(){$('clock').textContent=new Date().toLocaleString()};refreshClock();setInterval(refreshClock,1000);setupMenus();apply();
async function poll(){if(!bridgeReady||busy)return;busy=true;try{jobs=await window.pywebview.api.jobs();renderJobs();$('connection').textContent=`Local Python connected · ${jobs.filter(j=>j.status==='running').length} running · ${jobs.length} total` }catch(e){$('connection').textContent='Bridge error: '+e}finally{busy=false}}
window.addEventListener('pywebviewready',()=>{bridgeReady=true;log('Python bridge connected');poll();setInterval(poll,850)});
setTimeout(()=>{if(!bridgeReady)$('connection').textContent='Open this file through python main.py (not a regular browser tab)'},2500);
</script></body></html>
